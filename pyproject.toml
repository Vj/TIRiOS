[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tir-ios"
version = "0.1.0"
description = "TIRiOS - Modular iOS VAPT Framework aligned with OWASP MASVS"
requires-python = ">=3.11"
dependencies = [
    "lief>=0.15.0",
    "click>=8.1.7",
]

[project.optional-dependencies]
dast = [
    "frida>=16.0.0",
    "pymobiledevice3>=4.0.0",
    "mitmproxy>=10.0.0",
]
reporting = [
    "jinja2>=3.1.0",
    "weasyprint>=60.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
tir-ios = "tir_ios.cli:cli"

[tool.setuptools.packages.find]
include = ["tir_ios*"]

[tool.setuptools.package-data]
tir_ios = ["rules/*.json", "modules/dast/agents/*.js", "reporting/templates/*.j2"]